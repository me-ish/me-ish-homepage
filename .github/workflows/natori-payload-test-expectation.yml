name: Apply Natori payload test expectation

on:
  push:
    branches:
      - fix/natori-attachment-payload-limit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/natori-attachment-payload-limit
      - name: Update assertion and remove transport workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/features/natori/components/portfolio/__tests__/PortfolioStructuredCommissionForm.test.tsx")
          text = path.read_text()
          old = "1枚10MBまで（png / jpg / webp / gif）です。"
          new = "1枚4MBまで（png / jpg / webp / gif）です。"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one old label, found {count}")
          path.write_text(text.replace(old, new))
          Path(".github/workflows/natori-payload-test-expectation.yml").unlink()
      - name: Commit scoped update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/natori/components/portfolio/__tests__/PortfolioStructuredCommissionForm.test.tsx .github/workflows/natori-payload-test-expectation.yml
          git diff --cached --check
          git commit -m "test(natori): update attachment size expectation"
          git push origin HEAD:fix/natori-attachment-payload-limit
