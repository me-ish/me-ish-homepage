name: tmp-natori-mass-sample-upload

on:
  push:
    branches:
      - agent/natori-mass-sample-upload

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[mass-sample-editor-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/natori-mass-sample-upload
          fetch-depth: 0
      - name: Apply mass-production sample editor changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/features/natori/types/portfolio.ts",
              '''export type PortfolioOption = {\n  /** PortfolioPlan.id と同じ互換方針。 */\n  id: string | null;\n  name: string;\n  price: string;\n};\n\nexport type PortfolioDeliveryNote = {''',
              '''export type PortfolioOption = {\n  /** PortfolioPlan.id と同じ互換方針。 */\n  id: string | null;\n  name: string;\n  price: string;\n};\n\nexport type PortfolioMassProductionSample = {\n  /** 表示名から独立した一意なID。編集画面での追加・削除に使用 */\n  id: string;\n  /** 公開側で画像下に表示する作例名 */\n  name: string;\n  /** アップロード済みの公開画像URL。null の作例は公開側で非表示 */\n  image: string | null;\n};\n\nexport type PortfolioDeliveryNote = {'''
          )
          replace_once(
              "src/features/natori/types/portfolio.ts",
              '''  /** 量産イラストだけの受付状態。停止中も選択肢自体は公開フォームに表示する */\n  massProductionIllustrationOpen: boolean;\n  /** ヘッダーのサイト名 */''',
              '''  /** 量産イラストだけの受付状態。停止中も選択肢自体は公開フォームに表示する */\n  massProductionIllustrationOpen: boolean;\n  /** 量産イラスト作例。旧データ互換のため未設定を許容し、読込時に補完する */\n  massProductionSamples?: PortfolioMassProductionSample[];\n  /** ヘッダーのサイト名 */'''
          )

          replace_once(
              "src/features/natori/constants/portfolioContent.ts",
              '''/* ------------------------------------------------------------------\n   デフォルト掲載内容（DB未保存時の初期値）\n------------------------------------------------------------------- */\nexport const defaultPortfolioContent: PortfolioContent = {\n  commissionOpen: true,\n  massProductionIllustrationOpen: true,''',
              '''/* ------------------------------------------------------------------\n   デフォルト掲載内容（DB未保存時の初期値）\n------------------------------------------------------------------- */\nexport const DEFAULT_MASS_PRODUCTION_SAMPLES = [\n  { id: "obake", name: "おばけ", image: null },\n  { id: "majo", name: "魔女", image: null },\n] satisfies NonNullable<PortfolioContent["massProductionSamples"]>;\n\nexport const defaultPortfolioContent: PortfolioContent = {\n  commissionOpen: true,\n  massProductionIllustrationOpen: true,\n  massProductionSamples: DEFAULT_MASS_PRODUCTION_SAMPLES.map((sample) => ({ ...sample })),'''
          )

          replace_once(
              "src/features/natori/lib/portfolioContent.ts",
              '''const socialLinkSchema = z.object({\n  label: shortText,\n  href: z.string().max(1000),\n});\n\n// works の旧形式→新形式 transform があるため入力型と出力型が異なる。''',
              '''const socialLinkSchema = z.object({\n  label: shortText,\n  href: z.string().max(1000),\n});\n\nconst massProductionSampleSchema = z.object({\n  id: stableContentId,\n  name: shortText,\n  image: imageUrl,\n});\n\nconst LEGACY_MASS_PRODUCTION_SAMPLES = [\n  { id: "obake", name: "おばけ", image: null },\n  { id: "majo", name: "魔女", image: null },\n];\n\n// works の旧形式→新形式 transform があるため入力型と出力型が異なる。'''
          )
          replace_once(
              "src/features/natori/lib/portfolioContent.ts",
              '''  // 後から追加したフィールド。既存のDB行では受付中として補う\n  massProductionIllustrationOpen: z.boolean().optional().default(true),\n  artistName: shortText,''',
              '''  // 後から追加したフィールド。既存のDB行では受付中として補う\n  massProductionIllustrationOpen: z.boolean().optional().default(true),\n  // 旧DB行では「おばけ」「魔女」の空のアップロード枠を補う\n  massProductionSamples: z\n    .array(massProductionSampleSchema)\n    .max(12)\n    .optional()\n    .default(LEGACY_MASS_PRODUCTION_SAMPLES),\n  artistName: shortText,'''
          )
          replace_once(
              "src/features/natori/lib/portfolioContent.ts",
              '''    services: cleanList(content.services),\n    requests: cleanList(content.requests),\n    works: content.works.map((work) => ({''',
              '''    services: cleanList(content.services),\n    requests: cleanList(content.requests),\n    massProductionSamples: (content.massProductionSamples ?? [])\n      .map((sample) => ({ ...sample, name: sample.name.trim() }))\n      .filter((sample) => sample.name.length > 0),\n    works: content.works.map((work) => ({'''
          )

          pricing = Path("src/features/natori/components/portfolio/PortfolioPricing.tsx")
          text = pricing.read_text()
          if text.count('import Image from "next/image";\n') != 1:
              raise SystemExit("PortfolioPricing: next/image import anchor mismatch")
          text = text.replace('import Image from "next/image";\n', '', 1)
          old_const = '''const MASS_PRODUCTION_SAMPLES = [\n  {\n    label: "おばけ",\n    src: "/natori/portfolio/mass-production/obake.webp",\n  },\n  {\n    label: "魔女",\n    src: "/natori/portfolio/mass-production/majo.webp",\n  },\n] as const;\n\n'''
          if text.count(old_const) != 1:
              raise SystemExit("PortfolioPricing: hard-coded sample constant anchor mismatch")
          text = text.replace(old_const, '', 1)
          old_price = '  const massProductionPrice = yen(NATORI_MASS_PRODUCTION_BASE_AMOUNT);\n'
          new_price = '''  const massProductionPrice = yen(NATORI_MASS_PRODUCTION_BASE_AMOUNT);\n  const massProductionSamples = (content.massProductionSamples ?? []).filter(\n    (sample) => Boolean(sample.image)\n  );\n'''
          if text.count(old_price) != 1:
              raise SystemExit("PortfolioPricing: price anchor mismatch")
          text = text.replace(old_price, new_price, 1)
          old_samples = '''          <div\n            role="group"\n            aria-label="量産イラスト作例"\n            className="mx-auto mt-3 grid max-w-[18rem] grid-cols-2 gap-2 sm:mx-0 sm:max-w-xs sm:gap-3"\n          >\n            {MASS_PRODUCTION_SAMPLES.map((sample) => (\n              <figure key={sample.label}>\n                <Image\n                  src={sample.src}\n                  alt={`量産イラスト作例「${sample.label}」`}\n                  width={480}\n                  height={480}\n                  sizes="(min-width: 640px) 152px, 140px"\n                  className="aspect-square w-full rounded-xl border object-cover"\n                  style={{ borderColor: c.borderSubtle }}\n                />\n                <figcaption\n                  className="mt-1 text-center text-[11px] font-bold"\n                  style={{ color: c.textSoft }}\n                >\n                  {sample.label}\n                </figcaption>\n              </figure>\n            ))}\n          </div>'''
          new_samples = '''          {massProductionSamples.length > 0 ? (\n            <div\n              role="group"\n              aria-label="量産イラスト作例"\n              className={`mx-auto mt-3 grid gap-2 sm:mx-0 sm:gap-3 ${\n                massProductionSamples.length === 1\n                  ? "max-w-[9rem] grid-cols-1"\n                  : "max-w-[18rem] grid-cols-2 sm:max-w-xs"\n              }`}\n            >\n              {massProductionSamples.map((sample) => (\n                <figure key={sample.id}>\n                  {/* アップロード画像は公開Storage URLなので next/image のhost設定に依存させない */}\n                  {/* eslint-disable-next-line @next/next/no-img-element */}\n                  <img\n                    src={sample.image ?? ""}\n                    alt={`量産イラスト作例「${sample.name}」`}\n                    loading="lazy"\n                    className="aspect-square w-full rounded-xl border object-cover"\n                    style={{ borderColor: c.borderSubtle }}\n                  />\n                  <figcaption\n                    className="mt-1 text-center text-[11px] font-bold"\n                    style={{ color: c.textSoft }}\n                  >\n                    {sample.name}\n                  </figcaption>\n                </figure>\n              ))}\n            </div>\n          ) : null}'''
          if text.count(old_samples) != 1:
              raise SystemExit("PortfolioPricing: sample block anchor mismatch")
          pricing.write_text(text.replace(old_samples, new_samples, 1))

          editor = Path("src/features/natori/components/portfolio/edit/PortfolioEditor.tsx")
          text = editor.read_text()
          old_desc = '          description="どちらも丸い枠に表示されます。正方形に近い画像がおすすめです。"\n'
          if text.count(old_desc) != 1:
              raise SystemExit("PortfolioEditor: description anchor mismatch")
          text = text.replace(old_desc, '          description="メイン画像・アイコンと、量産イラストの作例画像を管理します。"\n', 1)
          old_close = '''            <ImageUploadField\n              label="プロフィールのアイコン"\n              value={content.aboutImage}\n              onChange={(v) => patch({ aboutImage: v })}\n              shape="circle"\n              hint="SNSと同じアイコンがおすすめ"\n              uploadDisabled={isDemo}\n            />\n          </div>\n        </SectionCard>'''
          new_close = '''            <ImageUploadField\n              label="プロフィールのアイコン"\n              value={content.aboutImage}\n              onChange={(v) => patch({ aboutImage: v })}\n              shape="circle"\n              hint="SNSと同じアイコンがおすすめ"\n              uploadDisabled={isDemo}\n            />\n          </div>\n\n          <div className="mt-5 border-t border-pink-100 pt-5">\n            <p className="text-sm font-black text-gray-900">量産イラスト作例</p>\n            <p className="mt-1 text-xs leading-5 text-gray-600">\n              画像を設定した作例だけ公開ページに表示されます。正方形の画像がおすすめです。\n            </p>\n\n            <div className="mt-4 space-y-4">\n              {(content.massProductionSamples ?? []).map((sample, index) => (\n                <div\n                  key={sample.id}\n                  className="rounded-xl border border-pink-100 bg-pink-50/30 p-3"\n                >\n                  <div className="flex items-start gap-2">\n                    <div className="min-w-0 flex-1">\n                      <TextInput\n                        label={`作例${index + 1}の名前`}\n                        value={sample.name}\n                        onChange={(v) =>\n                          patch({\n                            massProductionSamples: updateItem(\n                              content.massProductionSamples ?? [],\n                              index,\n                              { name: v }\n                            ),\n                          })\n                        }\n                      />\n                    </div>\n                    <div className="pt-5">\n                      <RowControls\n                        onRemove={() =>\n                          patch({\n                            massProductionSamples: removeItem(\n                              content.massProductionSamples ?? [],\n                              index\n                            ),\n                          })\n                        }\n                        confirmMessage={`${sample.name || `作例${index + 1}`}を削除しますか？`}\n                      />\n                    </div>\n                  </div>\n                  <div className="mt-3">\n                    <ImageUploadField\n                      label={`${sample.name || `作例${index + 1}`}の画像`}\n                      value={sample.image}\n                      onChange={(v) =>\n                        patch({\n                          massProductionSamples: updateItem(\n                            content.massProductionSamples ?? [],\n                            index,\n                            { image: v }\n                          ),\n                        })\n                      }\n                      hint="公開ページでは正方形にトリミングして表示されます"\n                      uploadDisabled={isDemo}\n                    />\n                  </div>\n                </div>\n              ))}\n            </div>\n\n            <AddButton\n              label="作例を追加"\n              onClick={() =>\n                patch({\n                  massProductionSamples: [\n                    ...(content.massProductionSamples ?? []),\n                    {\n                      id: `sample-${crypto.randomUUID()}`,\n                      name: "新しい作例",\n                      image: null,\n                    },\n                  ],\n                })\n              }\n            />\n          </div>\n        </SectionCard>'''
          if text.count(old_close) != 1:
              raise SystemExit("PortfolioEditor: image close anchor mismatch")
          editor.write_text(text.replace(old_close, new_close, 1))

          test = Path("src/features/natori/components/portfolio/__tests__/PortfolioPricing.test.tsx")
          text = test.read_text()
          if text.count('import type { ImgHTMLAttributes } from "react";\n') != 1:
              raise SystemExit("PortfolioPricing.test: type import anchor mismatch")
          text = text.replace('import type { ImgHTMLAttributes } from "react";\n', '', 1)
          mock = '''vi.mock("next/image", () => ({\n  default: ({ alt = "", ...props }: ImgHTMLAttributes<HTMLImageElement>) => (\n    // eslint-disable-next-line @next/next/no-img-element\n    <img {...props} alt={alt} />\n  ),\n}));\n\n'''
          if text.count(mock) != 1:
              raise SystemExit("PortfolioPricing.test: image mock anchor mismatch")
          text = text.replace(mock, '', 1)
          old_test = '''  it("shows the two compact mass-production samples", () => {\n    render(<PortfolioPricing content={defaultPortfolioContent} />);\n\n    const samples = screen.getByRole("group", { name: "量産イラスト作例" });\n    expect(samples.className).toContain("grid-cols-2");\n    expect(samples.className).toContain("max-w-[18rem]");\n\n    const obake = within(samples).getByRole("img", { name: "量産イラスト作例「おばけ」" });\n    const majo = within(samples).getByRole("img", { name: "量産イラスト作例「魔女」" });\n    expect(obake.getAttribute("src")).toBe("/natori/portfolio/mass-production/obake.webp");\n    expect(majo.getAttribute("src")).toBe("/natori/portfolio/mass-production/majo.webp");\n    expect(within(samples).getByText("おばけ")).toBeTruthy();\n    expect(within(samples).getByText("魔女")).toBeTruthy();\n  });'''
          new_test = '''  it("shows only mass-production samples with uploaded images", () => {\n    render(\n      <PortfolioPricing\n        content={{\n          ...defaultPortfolioContent,\n          massProductionSamples: [\n            { id: "obake", name: "おばけ", image: "https://example.com/obake.webp" },\n            { id: "majo", name: "魔女", image: null },\n          ],\n        }}\n      />\n    );\n\n    const samples = screen.getByRole("group", { name: "量産イラスト作例" });\n    expect(samples.className).toContain("grid-cols-1");\n    const obake = within(samples).getByRole("img", { name: "量産イラスト作例「おばけ」" });\n    expect(obake.getAttribute("src")).toBe("https://example.com/obake.webp");\n    expect(within(samples).getByText("おばけ")).toBeTruthy();\n    expect(within(samples).queryByText("魔女")).toBeNull();\n  });\n\n  it("hides the sample area while no sample image is uploaded", () => {\n    render(<PortfolioPricing content={defaultPortfolioContent} />);\n    expect(screen.queryByRole("group", { name: "量産イラスト作例" })).toBeNull();\n  });'''
          if text.count(old_test) != 1:
              raise SystemExit("PortfolioPricing.test: sample test anchor mismatch")
          test.write_text(text.replace(old_test, new_test, 1))

          test = Path("src/features/natori/lib/__tests__/portfolioContent.test.ts")
          text = test.read_text()
          anchor = '''  commissionOpen: true,\n  massProductionIllustrationOpen: true,\n  artistName: "Natori* illust",'''
          replacement = '''  commissionOpen: true,\n  massProductionIllustrationOpen: true,\n  massProductionSamples: [\n    { id: "obake", name: "おばけ", image: "https://example.com/obake.webp" },\n    { id: "majo", name: "魔女", image: null },\n  ],\n  artistName: "Natori* illust",'''
          if text.count(anchor) != 1:
              raise SystemExit("portfolioContent.test: fixture anchor mismatch")
          text = text.replace(anchor, replacement, 1)
          anchor2 = '''  it("量産イラストの受付状態が無い旧データは受付中で補完される", () => {\n    const { massProductionIllustrationOpen: _open, ...legacy } = validContent;\n    expect(parsePortfolioContent(legacy)?.massProductionIllustrationOpen).toBe(true);\n    expect(\n      parsePortfolioContent({\n        ...validContent,\n        massProductionIllustrationOpen: false,\n      })?.massProductionIllustrationOpen\n    ).toBe(false);\n  });\n\n'''
          if text.count(anchor2) != 1:
              raise SystemExit("portfolioContent.test: legacy anchor mismatch")
          text = text.replace(anchor2, anchor2 + '''  it("量産イラスト作例が無い旧データは空のアップロード枠で補完される", () => {\n    const { massProductionSamples: _samples, ...legacy } = validContent;\n    expect(parsePortfolioContent(legacy)?.massProductionSamples).toEqual([\n      { id: "obake", name: "おばけ", image: null },\n      { id: "majo", name: "魔女", image: null },\n    ]);\n  });\n\n''', 1)
          test.write_text(text)

          for asset in [
              Path("public/natori/portfolio/mass-production/obake.webp"),
              Path("public/natori/portfolio/mass-production/majo.webp"),
          ]:
              if asset.exists():
                  asset.unlink()
          PY

          rm -f .github/workflows/tmp-natori-mass-sample-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(natori): manage mass-production samples in editor [mass-sample-editor-applied]"
          git push origin HEAD:agent/natori-mass-sample-upload
