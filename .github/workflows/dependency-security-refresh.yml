name: Dependency Security Refresh

on:
  push:
    branches:
      - fix/dependency-security-audit

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-security-audit

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Upgrade security-sensitive direct dependencies
        run: npm install --save-exact next@15.5.25 eslint-config-next@15.5.25 sharp@0.35.4

      - name: Apply non-breaking audit fixes
        run: npm audit fix --audit-level=high || true

      - name: Capture audit JSON
        run: npm audit --json > audit.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-json
          path: audit.json
          retention-days: 1

      - name: Commit package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix(security): update vulnerable dependencies"
          git push origin HEAD:fix/dependency-security-audit
