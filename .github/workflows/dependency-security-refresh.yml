name: Dependency Security Refresh

on:
  push:
    branches:
      - fix/dependency-security-audit

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-security-audit

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Upgrade patched direct dependencies
        run: npm install --save-exact next@15.5.25 eslint-config-next@15.5.25 sharp@0.35.4 vitest@4.1.11 @vitest/coverage-v8@4.1.11

      - name: Override vulnerable Next-internal PostCSS within the same major
        run: |
          npm pkg set "overrides.next.postcss=8.5.28"
          npm install

      - name: Require zero high-or-critical advisories
        run: npm audit --audit-level=high

      - name: Capture final audit JSON
        run: npm audit --json > audit.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-final-json
          path: audit.json
          retention-days: 1

      - name: Commit package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix(security): finish vulnerable dependency updates"
          git push origin HEAD:fix/dependency-security-audit
