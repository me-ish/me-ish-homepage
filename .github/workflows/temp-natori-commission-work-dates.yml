name: Temporary Natori commission work dates

on:
  push:
    branches:
      - feat/natori-commission-work-dates

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/natori-commission-work-dates
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:80]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text)

          # Type: production month is optional for backward compatibility with existing JSON.
          replace_once(
              "src/features/natori/types/portfolio.ts",
              "  title: string;\n  /** タグ（複数可。例: [\\\"つなぐ\\\", \\\"立ち絵\\\"]）。旧データの単一 tag はパース時に移行される */",
              "  title: string;\n  /** 制作年月（YYYY-MM）。旧データ互換のため未設定を許容する */\n  productionMonth?: string | null;\n  /** タグ（複数可。例: [\\\"つなぐ\\\", \\\"立ち絵\\\"]）。旧データの単一 tag はパース時に移行される */",
          )
          replace_once(
              "src/features/natori/types/portfolio.ts",
              "  /** 作品ギャラリー */",
              "  /** ご依頼実績 */",
          )

          # Parser: preserve productionMonth when present; old rows remain unchanged.
          replace_once(
              "src/features/natori/lib/portfolioContent.ts",
              "    image: imageUrl,\n    collectionId: stableContentId.nullable().optional(),",
              "    image: imageUrl,\n    productionMonth: z.string().regex(/^\\d{4}-(?:0[1-9]|1[0-2])$/u).nullable().optional(),\n    collectionId: stableContentId.nullable().optional(),",
          )
          replace_once(
              "src/features/natori/lib/portfolioContent.ts",
              ".transform(({ id, title, tag, tags, image, collectionId, featured, published }) => ({",
              ".transform(({ id, title, tag, tags, image, productionMonth, collectionId, featured, published }) => ({",
          )
          replace_once(
              "src/features/natori/lib/portfolioContent.ts",
              "    image,\n    collectionId: collectionId ?? null,",
              "    image,\n    ...(productionMonth !== undefined ? { productionMonth } : {}),\n    collectionId: collectionId ?? null,",
          )

          # Public gallery: rename section and show production month on cards + modal.
          replace_once(
              "src/features/natori/components/portfolio/PortfolioGallery.tsx",
              "// 作品ギャラリー。マスキングテープで貼ったポラロイド風のカードを並べる。",
              "// ご依頼実績。マスキングテープで貼ったポラロイド風のカードを並べる。",
          )
          replace_once(
              "src/features/natori/components/portfolio/PortfolioGallery.tsx",
              "const GALLERY_PREVIEW_LIMIT = 6;\n",
              "const GALLERY_PREVIEW_LIMIT = 6;\n\nfunction formatProductionMonth(value?: string | null): string | null {\n  if (!value) return null;\n  const [year, month] = value.split(\"-\");\n  const monthNumber = Number(month);\n  if (!year || !Number.isInteger(monthNumber)) return null;\n  return `${year}年${monthNumber}月制作`;\n}\n",
          )
          replace_once(
              "src/features/natori/components/portfolio/PortfolioGallery.tsx",
              "          作品ギャラリー <span style={{ color: c.highlight }}>°˖✧</span>",
              "          ご依頼実績 <span style={{ color: c.highlight }}>°˖✧</span>",
          )
          replace_once(
              "src/features/natori/components/portfolio/PortfolioGallery.tsx",
              "              <p className=\"min-w-0 truncate font-bold\">{selected.title}</p>\n              {selectedCollection ||",
              "              <div className=\"min-w-0\">\n                <p className=\"truncate font-bold\">{selected.title}</p>\n                {formatProductionMonth(selected.productionMonth) ? (\n                  <p className=\"mt-0.5 text-xs\" style={{ color: c.textSoft }}>\n                    {formatProductionMonth(selected.productionMonth)}\n                  </p>\n                ) : null}\n              </div>\n              {selectedCollection ||",
          )
          replace_once(
              "src/features/natori/components/portfolio/PortfolioGallery.tsx",
              "      <div className=\"flex flex-col items-start gap-2 sm:flex-row sm:items-center sm:justify-between\">\n        <p className=\"w-full min-w-0 truncate text-sm font-bold sm:w-auto sm:text-base\">{work.title}</p>\n        <span className=\"flex shrink-0 flex-wrap justify-end gap-1\">",
              "      <div className=\"flex flex-col items-start gap-2 sm:flex-row sm:items-center sm:justify-between\">\n        <div className=\"w-full min-w-0 sm:w-auto\">\n          <p className=\"truncate text-sm font-bold sm:text-base\">{work.title}</p>\n          {formatProductionMonth(work.productionMonth) ? (\n            <p className=\"mt-0.5 text-xs\" style={{ color: c.textSoft }}>\n              {formatProductionMonth(work.productionMonth)}\n            </p>\n          ) : null}\n        </div>\n        <span className=\"flex shrink-0 flex-wrap justify-end gap-1\">",
          )

          # Editor: expose production month so future works can be maintained without DB edits.
          replace_once(
              "src/features/natori/components/portfolio/edit/PortfolioEditor.tsx",
              "        {/* 作品ギャラリー */}\n        <SectionCard\n          id=\"section-works\"\n          emoji=\"🎨\"\n          title=\"作品ギャラリー\"\n          description=\"作品の所属コレクション、代表表示、公開状態を設定できます。補助タグは受注経路などの管理用です。\"",
              "        {/* ご依頼実績 */}\n        <SectionCard\n          id=\"section-works\"\n          emoji=\"🎨\"\n          title=\"ご依頼実績\"\n          description=\"ご依頼実績の制作年月、所属コレクション、代表表示、公開状態を設定できます。補助タグは受注経路などの管理用です。\"",
          )
          replace_once(
              "src/features/natori/components/portfolio/edit/PortfolioEditor.tsx",
              "                    <TextInput\n                      label=\"タイトル\"\n                      value={work.title}\n                      onChange={(v) => patch({ works: updateItem(content.works, index, { title: v }) })}\n                    />\n                    <label className=\"block text-xs font-bold text-pink-700\">\n                      所属コレクション",
              "                    <TextInput\n                      label=\"タイトル\"\n                      value={work.title}\n                      onChange={(v) => patch({ works: updateItem(content.works, index, { title: v }) })}\n                    />\n                    <label className=\"block text-xs font-bold text-pink-700\">\n                      制作年月\n                      <input\n                        type=\"month\"\n                        value={work.productionMonth ?? \"\"}\n                        onChange={(event) =>\n                          patch({\n                            works: updateItem(content.works, index, {\n                              productionMonth: event.target.value || null,\n                            }),\n                          })\n                        }\n                        className=\"mt-1 w-full rounded-lg border border-pink-200 bg-white px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-pink-300\"\n                      />\n                    </label>\n                    <label className=\"block text-xs font-bold text-pink-700\">\n                      所属コレクション",
          )
          replace_once(
              "src/features/natori/components/portfolio/edit/PortfolioEditor.tsx",
              "                      title: \"新しい作品\",\n                      tags: [],",
              "                      title: \"新しい作品\",\n                      productionMonth: null,\n                      tags: [],",
          )
          replace_once(
              "src/features/natori/components/portfolio/edit/PortfolioEditor.tsx",
              "          title: titleFromFileName(file.name),\n          tags: [],",
              "          title: titleFromFileName(file.name),\n          productionMonth: null,\n          tags: [],",
          )

          # SEO copy follows the visible section name.
          replace_once(
              "src/app/[locale]/natori/portfolio/page.tsx",
              "コミッションポートフォリオ。作品ギャラリー・料金・ご依頼フォーム。",
              "コミッションポートフォリオ。ご依頼実績・料金・ご依頼フォーム。",
          )

          # Parser regression coverage.
          replace_once(
              "src/features/natori/lib/__tests__/portfolioContent.test.ts",
              "  it(\"保存済みの『へようこそ』タイトルを自然な表記へ移行する\", () => {",
              "  it(\"作品の制作年月を YYYY-MM 形式で保持する\", () => {\n    const withMonth: PortfolioContent = {\n      ...validContent,\n      works: validContent.works.map((work, index) =>\n        index === 0 ? { ...work, productionMonth: \"2026-05\" } : work\n      ),\n    };\n\n    expect(parsePortfolioContent(withMonth)?.works[0]?.productionMonth).toBe(\"2026-05\");\n    expect(\n      parsePortfolioContent({\n        ...withMonth,\n        works: [{ ...withMonth.works[0], productionMonth: \"2026-13\" }],\n      })\n    ).toBeNull();\n  });\n\n  it(\"保存済みの『へようこそ』タイトルを自然な表記へ移行する\", () => {",
          )
          PY

      - name: Verify
        run: |
          npm ci
          npm test -- --run
          npx tsc --noEmit
          npm run lint
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/temp-natori-commission-work-dates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(natori): show commission work production months"
          git push origin HEAD:feat/natori-commission-work-dates
