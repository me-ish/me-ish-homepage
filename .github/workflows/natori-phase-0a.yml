name: Natori Phase 0A

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/natori-phase-0a.yml'
      - 'scripts/natori-phase-t/**'
      - 'scripts/natori-phase-0a/**'
      - 'src/lib/entryUpload*'
      - 'src/lib/server/entryUpload*'
      - 'src/lib/supabaseAdmin.ts'
      - 'src/lib/supabaseClient.ts'
      - 'src/lib/imageSniff.ts'
      - 'src/lib/rateLimit.ts'
      - 'src/lib/auth/csrf.ts'
      - 'src/app/api/entry/upload/**'
      - 'src/app/**/entry/FormWrapper.tsx'
      - 'src/features/natori/lib/consultationUploadEndpoint.ts'
      - 'src/features/natori/components/consultation/ConsultationThread.tsx'
      - 'supabase/migrations/*natori_phase_0a*'
      - 'supabase/operations/natori-phase-0a/**'
      - 'docs/natori/Natori_Phase_0A*'
      - '.node-version'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: natori-phase-0a-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  storage:
    name: Storage cutover compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PHASE_T_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PHASE_0A: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install locked test dependencies during construction
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test real server adapter before and after isolated cutover
        run: bash scripts/natori-phase-t/run.sh
      - name: Publish non-secret evidence only
        if: always() && env.PHASE_T_RESULTS != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: natori-phase-0a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PHASE_T_RESULTS }}/*
          if-no-files-found: error
          retention-days: 7
