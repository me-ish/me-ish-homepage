name: Natori Phase T

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/natori-phase-t.yml'
      - 'scripts/natori-phase-t/**'
      - 'docs/natori/Natori_Phase_T_Result.md'
      - '.node-version'

permissions:
  contents: read

concurrency:
  group: natori-phase-t-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  storage:
    name: Isolated Storage authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PHASE_T_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
      - name: Build isolated stack and compare policies
        run: bash scripts/natori-phase-t/run.sh
      - name: Publish non-secret evidence only
        if: always() && env.PHASE_T_RESULTS != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: natori-phase-t-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PHASE_T_RESULTS }}/*
          if-no-files-found: error
          retention-days: 7
