name: Natori hero profile copy codemod

on:
  push:
    branches:
      - agent/natori-hero-profile-copy
    paths:
      - .github/workflows/natori-hero-profile-copy-codemod.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/natori-hero-profile-copy
      - name: Update hero and profile copy
        run: |
          python - <<'PY'
          from pathlib import Path

          content_path = Path('src/features/natori/constants/portfolioContent.ts')
          text = content_path.read_text()

          old_hero = '''  heroDescription:\n    "淡いピンクや水色を基調とした、やわらかく可愛い女の子のイラストを描いています。アニメ塗りをベースに、シンプルながらも印象に残る表現を心がけています。",'''
          new_hero = '''  heroDescription:\n    "女の子のキャラクターイラストを中心に制作しています。「かわいい」「きゅんとする」と感じてもらえる一枚を目指しています。",'''

          old_about = '''  aboutParagraphs: [\n    "淡いピンクや水色を基調とした、やわらかく可愛い女の子のイラストを描いています。アニメ塗りをベースに、シンプルながらも印象に残る表現を心がけています。",\n    "アイコン・一枚絵・創作キャラクターなどのご依頼を中心にお受けしています。ご希望の雰囲気やこだわりにも丁寧に寄り添い、一枚一枚大切に制作いたします。",\n    "「かわいい」「きゅんとする」イラストをお求めの方は、ぜひお気軽にご相談ください。",\n  ],'''
          new_about = '''  aboutParagraphs: [\n    "イラストレーターのナトリです。",\n    "ご依頼では、キャラクターの雰囲気やご希望を大切にしながら、丁寧に相談しつつ制作を進めています。",\n    "「こんな感じにしたい」という段階からでも大丈夫です。かわいく、見た人の印象に残る一枚を一緒に作れたら嬉しいです。",\n  ],'''

          if old_hero not in text:
              raise SystemExit('old hero copy not found')
          if old_about not in text:
              raise SystemExit('old about copy not found')

          text = text.replace(old_hero, new_hero, 1).replace(old_about, new_about, 1)
          content_path.write_text(text)

          hero_path = Path('src/features/natori/components/portfolio/PortfolioHero.tsx')
          hero = hero_path.read_text()
          old_helper = '''function firstSentence(text: string): string {\n  const end = text.indexOf("。");\n  return end < 0 ? text : text.slice(0, end + 1);\n}\n\n'''
          old_render = '{variant === "showcase" ? content.heroDescription : firstSentence(content.heroDescription)}'
          new_render = '{content.heroDescription}'
          if old_helper not in hero:
              raise SystemExit('firstSentence helper not found')
          if old_render not in hero:
              raise SystemExit('hero render expression not found')
          hero = hero.replace(old_helper, '', 1).replace(old_render, new_render, 1)
          hero_path.write_text(hero)
          PY
      - name: Commit changes
        run: |
          git config user.name "me-ish"
          git config user.email "info@me-ish.art"
          git add src/features/natori/constants/portfolioContent.ts src/features/natori/components/portfolio/PortfolioHero.tsx
          git commit -m "feat(natori): refine hero and profile copy"
          git push origin HEAD:agent/natori-hero-profile-copy